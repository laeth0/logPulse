services:
  app:
    build:
      context: .
      target: production
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8080}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-10mb}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      LOG_PARTITION_DAYS_AHEAD: ${LOG_PARTITION_DAYS_AHEAD:-7}
      DB_HOST: database
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-log_pulse}
      DB_SSL: ${DB_SSL:-false}
    ports:
      - '8080:8080'
    depends_on:
      database:
        condition: service_healthy
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-log_pulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    shm_size: 128mb
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

volumes:
  postgres_data:
