services:
  app:
    build:
      context: .
      target: production
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8080}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-10mb}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      LOG_PARTITION_DAYS_AHEAD: ${LOG_PARTITION_DAYS_AHEAD:-7}
      DB_HOST: database
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-log_pulse}
      DB_SSL: ${DB_SSL:-false}
      DB_READ_POOL_MAX: ${DB_READ_POOL_MAX:-5}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      LOADGEN_API_KEY: ${LOADGEN_API_KEY:-lp_n_xrXP288usaY5rSTdQsTwkIKL-vVM9i}
      LOADGEN_TENANT_PASSWORD: ${LOADGEN_TENANT_PASSWORD:-please-change-me-in-production}
      JWT_SECRET: ${JWT_SECRET:-please-change-me-in-production}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      JWT_REFRESH_TOKEN_TTL_DAYS: ${JWT_REFRESH_TOKEN_TTL_DAYS:-7}
    ports:
      - '8080:8080'
    depends_on:
      database:
        condition: service_healthy
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  database:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=640MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=40
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=512MB
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_timeout=15min
      - -c
      - commit_delay=2000
      - -c
      - commit_siblings=5
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - jit=off
      - -c
      - max_parallel_workers_per_gather=0
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-log_pulse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    shm_size: 128mb
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

volumes:
  postgres_data:
